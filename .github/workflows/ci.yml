name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore
        run: dotnet restore BiscottiWin.slnx
      - name: Build
        run: dotnet build -c Release --no-restore BiscottiWin.slnx
      - name: Tests
        run: dotnet test -c Release --no-build Biscotti.Tests
