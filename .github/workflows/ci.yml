name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore BiscottiWin.slnx
      - name: Build
        run: dotnet build -c Release --no-restore BiscottiWin.slnx
      - name: Tests
        run: dotnet test -c Release --no-build BiscottiWin.slnx
      - name: Package and smoke-test the per-user release ZIP
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "biscotti-release-$env:GITHUB_RUN_ID"
          ./tools/package-windows.ps1 -Version "0.0.0-ci.$env:GITHUB_RUN_NUMBER" -OutputDirectory $output
          ./tools/test-release-package.ps1 -PackagePath (Join-Path $output "BiscottiWin-0.0.0-ci.$env:GITHUB_RUN_NUMBER-win-x64.zip")
