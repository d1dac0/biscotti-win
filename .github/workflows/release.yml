name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    environment: windows-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore, build, and test
        shell: pwsh
        run: ./tools/check.ps1
      - name: Publish, sign, and package
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $output = Join-Path $env:RUNNER_TEMP "biscotti-release-$version"
          ./tools/package-windows.ps1 -Version $version -OutputDirectory $output -Sign
          "PACKAGE_PATH=$output\BiscottiWin-$version-win-x64.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify install, launch, upgrade, uninstall, and data retention
        shell: pwsh
        run: ./tools/test-release-package.ps1 -PackagePath $env:PACKAGE_PATH
      - name: Publish signed release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME $env:PACKAGE_PATH "$env:PACKAGE_PATH.sha256" `
            --title "Biscotti Win $($env:GITHUB_REF_NAME -replace '^v', '')" --generate-notes
